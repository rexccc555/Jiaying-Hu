[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cut-post"
version = "0.1.0"
description = "成片后一键填入小红书/抖音创作者后台，默认预览，确认才发布"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "python-multipart>=0.0.12",
  "requests>=2.28.0",
  "websockets>=12.0",
]

[project.scripts]
cutpost = "cutpost.cli:main"

[tool.setuptools.packages.find]
include = ["cutpost*"]
