[build]
  publish = "public"
  command = "echo static"

[build.environment]
  # The Next.js runtime is still enabled in the Netlify UI; this site is plain static files.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
