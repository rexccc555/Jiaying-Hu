# Railway: Dockerfile path for xhs-worker (service settings also set via GraphQL).
# Public domain should target Railway $PORT (usually 8080), not EXPOSE 8787.

[build]
builder = "DOCKERFILE"
dockerfilePath = "services/xhs-worker/Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
