<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>卡号管理 · MP Video Assistant</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #fbf7f1; color: #15243b; font-family: "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 32px 20px 60px; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
  h1 { font-size: 1.35rem; margin: 0; }
  .card { background: #fff; border: 1px solid #ece4d8; border-radius: 20px; padding: 22px; box-shadow: 0 18px 50px -30px rgba(21,36,59,.3); margin-bottom: 18px; }
  h2 { font-size: 1rem; margin: 0 0 14px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  input, select { padding: 10px 12px; border-radius: 12px; border: 1px solid #ece4d8; font: inherit; font-size: 15px; outline: none; background: #fff; }
  input:focus { border-color: #ff7a59; }
  button { padding: 10px 16px; border: 1px solid #ece4d8; border-radius: 12px; cursor: pointer; font: inherit; font-size: 14px; background: #fff; color: #15243b; }
  button.main { border: 0; color: #fff; font-weight: 700; background: linear-gradient(135deg, #ff7a59, #ff9a5a); }
  button.preset.on { border-color: #ff7a59; background: #fff3ee; color: #d4532e; font-weight: 700; }
  button.small { padding: 5px 10px; font-size: 13px; border-radius: 9px; }
  button.danger { color: #c0392b; }
  .muted { color: #66758a; font-size: 13px; }
  .err { color: #c0392b; font-size: 13px; min-height: 1em; margin: 8px 0 0; }
  #made { margin-top: 14px; }
  #made code { display: inline-block; margin: 4px 8px 4px 0; padding: 6px 10px; border-radius: 9px; background: #fff3ee; font-size: 15px; letter-spacing: .05em; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid #f1ebe2; white-space: nowrap; }
  th { color: #66758a; font-weight: 600; font-size: 13px; }
  td.code { font-family: Consolas, monospace; font-size: 14px; letter-spacing: .04em; cursor: pointer; }
  .bar { width: 90px; height: 6px; border-radius: 6px; background: #f1ebe2; overflow: hidden; display: inline-block; vertical-align: middle; margin-right: 6px; }
  .bar i { display: block; height: 100%; background: #ff7a59; }
  .tag { padding: 3px 9px; border-radius: 99px; font-size: 12px; font-weight: 600; }
  .tag.new { background: #eef4ff; color: #2c5cc5; }
  .tag.active { background: #e9f8ef; color: #1e8a4c; }
  .tag.used_up { background: #fdeceb; color: #c0392b; }
  .tag.disabled { background: #f1f1f1; color: #888; }
  .scroll { overflow-x: auto; }
  #login { max-width: 380px; margin: 12vh auto 0; text-align: center; }
  #login input { width: 100%; text-align: center; }
  #login button { width: 100%; margin-top: 12px; }
</style>
</head>
<body>
<main>
  <form id="login" class="card" hidden>
    <h1 style="margin-bottom:6px">卡号管理</h1>
    <p class="muted" style="margin:0 0 16px">请输入管理员密码</p>
    <input id="pw" type="password" autocomplete="current-password" placeholder="管理员密码" />
    <button class="main" type="submit">进入</button>
    <p class="err" id="login-err"></p>
  </form>

  <div id="panel" hidden>
    <header>
      <h1>卡号管理</h1>
      <div class="row"><a href="/" class="muted">打开网站</a><button type="button" id="logout" class="small">退出</button></div>
    </header>

    <section class="card">
      <h2>生成卡号</h2>
      <div class="row" id="presets">
        <button type="button" class="preset" data-min="10">10 分钟</button>
        <button type="button" class="preset" data-min="20">20 分钟</button>
        <button type="button" class="preset on" data-min="30">30 分钟</button>
        <button type="button" class="preset" data-min="60">60 分钟</button>
        <span class="muted">或自定义</span>
        <input id="minutes" type="number" min="1" value="30" style="width:90px" /> <span class="muted">分钟</span>
      </div>
      <div class="row" style="margin-top:12px">
        <span class="muted">数量</span><input id="count" type="number" min="1" max="50" value="1" style="width:80px" />
        <input id="note" placeholder="备注（比如给谁的）" style="flex:1;min-width:200px" />
        <button type="button" class="main" id="create">生成</button>
      </div>
      <p class="err" id="create-err"></p>
      <div id="made"></div>
      <p class="muted" style="margin:10px 0 0">计时方式：对方打开制作页面期间才扣时间，关掉页面就暂停。时间用完会立刻锁住，正在做的片子也不能再看和下载。</p>
    </section>

    <section class="card">
      <div class="row" style="justify-content:space-between;margin-bottom:10px">
        <h2 style="margin:0">全部卡号 <span class="muted" id="summary"></span></h2>
        <button type="button" class="small" id="refresh">刷新</button>
      </div>
      <div class="scroll">
        <table>
          <thead><tr><th>卡号</th><th>备注</th><th>总时长</th><th>已用 / 剩余</th><th>状态</th><th>最近使用</th><th>创建</th><th></th></tr></thead>
          <tbody id="rows"><tr><td colspan="8" class="muted">加载中…</td></tr></tbody>
        </table>
      </div>
    </section>
  </div>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const STATUS = { new: "未使用", active: "使用中", used_up: "已用完", disabled: "已停用" };

  async function api(path, options = {}) {
    const res = await fetch(path, { ...options, headers: { "Content-Type": "application/json" } });
    const data = await res.json().catch(() => ({}));
    if (res.status === 401 && path !== "/api/admin/login") { showLogin(); throw new Error("login"); }
    if (!res.ok) throw new Error(data.error || res.statusText);
    return data;
  }

  function showLogin() { $("login").hidden = false; $("panel").hidden = true; $("pw").focus(); }
  function showPanel() { $("login").hidden = true; $("panel").hidden = false; }

  const mins = (sec) => {
    const m = Math.floor(sec / 60), s = Math.round(sec % 60);
    return m >= 1 ? `${m} 分${s ? ` ${s} 秒` : ""}` : `${s} 秒`;
  };
  const when = (ts) => (ts ? new Date(ts).toLocaleString("zh-CN", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "—");
  const esc = (v) => String(v ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

  async function load() {
    const { cards } = await api("/api/admin/cards");
    showPanel();
    const live = cards.filter((c) => c.status === "active" || c.status === "new").length;
    $("summary").textContent = `· 共 ${cards.length} 张，可用 ${live} 张`;
    $("rows").innerHTML = cards.length ? cards.map((c) => {
      const pct = Math.min(100, (c.usedSec / (c.minutes * 60)) * 100);
      return `<tr>
        <td class="code" title="点击复制" data-copy="${esc(c.code)}">${esc(c.code)}</td>
        <td>${esc(c.note) || '<span class="muted">—</span>'}</td>
        <td>${c.minutes} 分钟</td>
        <td><span class="bar"><i style="width:${pct}%"></i></span>${mins(c.usedSec)} / <b>${mins(c.remainingSec)}</b></td>
        <td><span class="tag ${c.status}">${STATUS[c.status]}</span></td>
        <td class="muted">${when(c.lastBeat)}</td>
        <td class="muted">${when(c.created)}</td>
        <td>
          <button type="button" class="small" data-act="add" data-code="${esc(c.code)}">加时</button>
          <button type="button" class="small" data-act="${c.disabled ? "enable" : "disable"}" data-code="${esc(c.code)}">${c.disabled ? "启用" : "停用"}</button>
          <button type="button" class="small danger" data-act="delete" data-code="${esc(c.code)}">删除</button>
        </td></tr>`;
    }).join("") : '<tr><td colspan="8" class="muted">还没有卡号，在上面生成一张。</td></tr>';
  }

  $("login").addEventListener("submit", async (e) => {
    e.preventDefault();
    $("login-err").textContent = "";
    try {
      await api("/api/admin/login", { method: "POST", body: JSON.stringify({ password: $("pw").value }) });
      $("pw").value = "";
      load();
    } catch { $("login-err").textContent = "密码不对"; }
  });

  $("logout").addEventListener("click", async () => { await api("/api/admin/logout", { method: "POST" }).catch(() => {}); showLogin(); });

  $("presets").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-min]");
    if (!btn) return;
    document.querySelectorAll(".preset").forEach((b) => b.classList.toggle("on", b === btn));
    $("minutes").value = btn.dataset.min;
  });
  $("minutes").addEventListener("input", () =>
    document.querySelectorAll(".preset").forEach((b) => b.classList.toggle("on", b.dataset.min === $("minutes").value)));

  $("create").addEventListener("click", async () => {
    $("create-err").textContent = "";
    try {
      const { cards } = await api("/api/admin/cards", {
        method: "POST",
        body: JSON.stringify({ minutes: Number($("minutes").value), count: Number($("count").value), note: $("note").value.trim() }),
      });
      $("made").innerHTML = `<span class="muted">新卡号（点击复制）：</span><br>` + cards.map((c) => `<code data-copy="${esc(c.code)}">${esc(c.code)}</code>`).join("");
      load();
    } catch (err) { $("create-err").textContent = err.message === "minutes" ? "分钟数不对" : err.message === "count" ? "数量要在 1–50 之间" : err.message; }
  });

  document.addEventListener("click", async (e) => {
    const copy = e.target.closest("[data-copy]");
    if (copy) {
      await navigator.clipboard.writeText(copy.dataset.copy).catch(() => {});
      const old = copy.textContent; copy.textContent = "已复制 ✓"; setTimeout(() => (copy.textContent = old), 900);
      return;
    }
    const btn = e.target.closest("[data-act]");
    if (!btn) return;
    const code = btn.dataset.code, act = btn.dataset.act;
    try {
      if (act === "delete") {
        if (!confirm(`删除卡号 ${code}？删除后对方立即无法使用。`)) return;
        await api(`/api/admin/cards/${code}`, { method: "DELETE" });
      } else if (act === "add") {
        const extra = prompt(`给 ${code} 加多少分钟？`, "30");
        if (!extra) return;
        await api(`/api/admin/cards/${code}`, { method: "POST", body: JSON.stringify({ action: "add", minutes: Number(extra) }) });
      } else {
        await api(`/api/admin/cards/${code}`, { method: "POST", body: JSON.stringify({ action: act }) });
      }
      load();
    } catch (err) { if (err.message !== "login") alert(err.message); }
  });

  $("refresh").addEventListener("click", () => load().catch(() => {}));
  setInterval(() => !$("panel").hidden && load().catch(() => {}), 15000);
  load().catch(() => {});
</script>
</body>
</html>
