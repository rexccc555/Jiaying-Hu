<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>MP Video Assistant</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #fbf7f1; color: #15243b;
      font-family: "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", sans-serif; }
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: none; }
    .state { min-height: 100%; display: grid; place-items: center; padding: 24px; text-align: center; }
    .card { background: #fff; border: 1px solid #ece4d8; border-radius: 24px; padding: 34px 28px; max-width: 420px;
      box-shadow: 0 18px 50px -24px rgba(21,36,59,.28); }
    .icon { width: 56px; height: 56px; border-radius: 18px; margin: 0 auto 14px; display: grid; place-items: center; font-size: 26px;
      background: linear-gradient(135deg, #ff7a59, #ffb347); }
    h1 { font-size: 1.2rem; margin: 0 0 8px; }
    p { color: #66758a; font-size: 14px; line-height: 1.7; margin: 0; }
    .spin { animation: spin 1.2s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="state" id="state">
    <div class="card">
      <div class="icon"><span class="spin" id="icon">✦</span></div>
      <h1 id="title">正在连接制作工具…</h1>
      <p id="sub">Connecting to the studio…</p>
    </div>
  </div>
  <iframe id="studio" title="MP Video Assistant" allow="fullscreen; clipboard-write"></iframe>
  <script>
    const offline = () => {
      document.getElementById("icon").className = "";
      document.getElementById("icon").textContent = "🌙";
      document.getElementById("title").textContent = "制作工具现在没有开";
      document.getElementById("sub").innerHTML =
        "请在制作电脑上双击 start.bat，等一分钟后刷新本页。<br />The studio is offline. Start it on the studio computer, then refresh in a minute.";
    };
    (async () => {
      try {
        const info = await (await fetch("/tunnel.json", { cache: "no-store" })).json();
        const ping = await fetch(`${info.url}/api/remote/ping`, { cache: "no-store" });
        if (!ping.ok) throw new Error("offline");
        const frame = document.getElementById("studio");
        frame.src = `${info.url}/`;
        frame.style.display = "block";
        document.getElementById("state").style.display = "none";
      } catch {
        offline();
      }
    })();
  </script>
</body>
</html>
